<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Trezioplay — teste YouTube/Tizen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff;
      font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 18px; font-size: 20px; }
    #player-wrap { flex: 1; min-height: 0; }
    #player { width: 100%; height: 100%; }
    #status { min-height: 48px; padding: 10px 18px; font-size: 16px; background: #151515; }
  </style>
</head>
<body>
  <header>Trezioplay — diagnóstico do player</header>
  <main id="player-wrap">
    <div id="player"></div>
  </main>
  <div id="status">Carregando API do YouTube…</div>
  <script>
    // Troque pelo ID de um vídeo público que permita incorporação.
    var VIDEO_ID = 'yc9moz7aNOY';
    var statusNode = document.getElementById('status');
    var player;

    function setStatus(message) {
      statusNode.textContent = message;
      console.log('[YT test]', message);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: VIDEO_ID,
        playerVars: {
          playsinline: 1,
          enablejsapi: 1,
          origin: window.location.origin,
          rel: 0
        },
        events: {
          onReady: function () { setStatus('Player pronto. Pressione OK/Enter para iniciar se necessário.'); },
          onStateChange: function (event) {
            var names = { '-1': 'não iniciado', '0': 'finalizado', '1': 'reproduzindo',
              '2': 'pausado', '3': 'buffering', '5': 'vídeo carregado' };
            setStatus('Estado do player: ' + (names[event.data] || event.data));
          },
          onError: function (event) {
            setStatus('Erro do YouTube: ' + event.data +
              (event.data === 153 ? ' — falta Referer/identificação do cliente.' : ''));
          }
        }
      });
    };

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = function () { setStatus('Não foi possível carregar a API do YouTube. Verifique rede/DNS/TLS.'); };
    document.head.appendChild(tag);
  </script>
</body>
</html>
